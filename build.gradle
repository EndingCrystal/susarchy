plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = uri('local-neoforge') }
    maven { url = uri('local-maven') }
    maven { url = 'https://neoforged.forgecdn.net/releases' }
    mavenCentral()
}

dependencies {
    compileOnly files('libs/jade-1.21.1-NeoForge-15.10.6.jar')
    compileOnly files('libs/jei-1.21.1-neoforge-19.51.0.418.jar')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

configurations.matching { it.name == 'gameTestServerLegacyClasspath' }.configureEach {
    exclude group: 'io.netty', module: 'netty-transport-native-epoll'
}

if (providers.gradleProperty('localNeoForgeConfig').isPresent()) {
    afterEvaluate {
        def config = configurations.findByName('neoForgeConfigOnly')
        if (config != null) {
            config.dependencies.clear()
            config.dependencies.add(dependencies.create(files(providers.gradleProperty('localNeoForgeConfig').get())))
        }
    }
}

if (providers.gradleProperty('localDevLaunch').isPresent()) {
    configurations.runtimeClasspath {
        exclude group: 'net.neoforged', module: 'DevLaunch'
    }
    dependencies {
        runtimeOnly files(providers.gradleProperty('localDevLaunch').get())
    }
}

